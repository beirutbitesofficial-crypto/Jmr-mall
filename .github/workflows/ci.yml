name: JMR CI

on:
  push:
    branches: [main, "fix/**", "hostinger-**"]
  pull_request:
    branches: [main, "hostinger-**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jmr
          POSTGRES_PASSWORD: jmr
          POSTGRES_DB: jmr
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - run: npm install
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://jmr:jmr@localhost:5432/jmr
      - run: npm run lint
      - run: npm run build
